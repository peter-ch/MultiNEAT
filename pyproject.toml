[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "MultiNEAT"
version = "0.6.0"
description = "NeuroEvolution library: NEAT, HyperNEAT, ES-HyperNEAT, novelty search and more"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Peter Chervenski", email = "spookey@abv.bg" }]
requires-python = ">=3.8"
keywords = ["neuroevolution", "NEAT", "HyperNEAT", "ES-HyperNEAT", "genetic algorithm", "neural networks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
viz = ["numpy", "matplotlib", "opencv-python"]
graph = ["networkx"]
test = ["pytest", "numpy"]

[project.urls]
Homepage = "https://github.com/peter-ch/MultiNEAT"
Issues = "https://github.com/peter-ch/MultiNEAT/issues"

[tool.scikit-build]
minimum-version = "0.8"
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"
wheel.packages = ["MultiNEAT"]
wheel.exclude = ["MultiNEAT/*.dll", "MultiNEAT/__pycache__/**"]
sdist.include = ["src", "MultiNEAT", "examples", "tests", "CMakeLists.txt", "LICENSE", "README.md"]
sdist.exclude = ["build", ".vs", ".idea", "vcpkg_installed", "*.pyd", "*.so"]

[tool.scikit-build.cmake.define]
MULTINEAT_BUILD_PYTHON = "ON"
MULTINEAT_BUILD_EXAMPLES = "OFF"
MULTINEAT_BUILD_CPP_LIBRARY = "OFF"
VCPKG_MANIFEST_MODE = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests -q"
